services:
  - type: web
    name: edustream-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app"

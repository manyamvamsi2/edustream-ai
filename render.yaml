services:
  - type: web
    name: edustream-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app"
